name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/arbor_ci
      APP_BASE_URL: http://localhost:3000
      DEMO_MODE: "false"
      RUN_SCHEDULER: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: arbor_ci
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types and lint
        run: |
          npm exec -- tsc --noEmit
          npm exec -- eslint src
      - name: Run unit tests
        run: npm test
      - name: Run migrations and PostgreSQL tests
        run: |
          npm run db:migrate
          npm run test:db
      - name: Build
        run: npm run build
      - name: Check application startup
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > "${RUNNER_TEMP}/arbor.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 12 --retry-delay 1 --retry-connrefused http://127.0.0.1:3000/api/health ||
            { cat "${RUNNER_TEMP}/arbor.log"; exit 1; }
